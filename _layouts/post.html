---
layout: default
---
<article class="post">
  <header class="post__header">
    <h1 class="post__title">{{ page.title }}</h1>
    <p class="post__meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    </p>
  </header>

  <div class="post__content">
    {{ content }}
  </div>

  <div class="subscribe-banner subscribe-banner--post">
    <p>Enjoyed this update? Get the next one by email — roughly once a month.</p>
    <a class="btn" href="{{ site.mailchimp_signup_url }}" target="_blank" rel="noopener">Subscribe to Beemail</a>
  </div>

  <p class="post__back"><a href="{{ '/' | relative_url }}">&larr; All updates</a></p>
</article>
