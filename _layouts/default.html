<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body>
  {% include header.html %}
  <main class="wrap page-main">
    {{ content }}
  </main>
  {% include footer.html %}

  <dialog class="lightbox" id="lightbox">
    <div class="lightbox__inner">
      <button type="button" class="lightbox__close" id="lightbox-close" aria-label="Close">&times;</button>
      <img class="lightbox__img" id="lightbox-img" src="" alt="">
      <p class="lightbox__caption" id="lightbox-caption" hidden></p>
    </div>
  </dialog>
  <script src="{{ '/assets/js/lightbox.js' | relative_url }}" defer></script>
</body>
</html>
