<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      <img class="site-brand__logo" src="{{ '/assets/images/logo.svg' | relative_url }}" alt="HIVE 490 logo" width="72" height="72">
      <span class="site-brand__text">
        <span class="site-brand__title">HIVE 490</span>
        <span class="site-brand__tagline">{{ site.tagline }}</span>
      </span>
    </a>

    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}">Updates</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a class="site-nav__subscribe" href="{{ site.mailchimp_signup_url }}" target="_blank" rel="noopener">Subscribe</a>
    </nav>
  </div>
</header>
